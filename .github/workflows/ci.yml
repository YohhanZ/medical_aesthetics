name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend run test

      - name: Build customer application
        env:
          VITE_CUSTOMER_URL: /
        run: npm --prefix frontend run build --workspace @ma/customer

      - name: Build admin application
        env:
          VITE_CUSTOMER_URL: /
        run: npm --prefix frontend run build --workspace @ma/admin -- --mode cloud-demo

  backend:
    name: Backend checks and consultation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      MA_ENVIRONMENT: test
      MA_AGENT_RUNTIME: inprocess
      LANGSMITH_TRACING: "false"
      MA_DATABASE_URL: "postgresql://ma_ci:ci-test-only@127.0.0.1:55434/ma_m1_test"
      MA_TEST_DATABASE_URL: "postgresql://ma_ci:ci-test-only@127.0.0.1:55434/ma_m1_test"

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: ma_m1_test
          POSTGRES_USER: ma_ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U ma_ci -d ma_m1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock -r deployment/requirements.lock
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run type checking
        run: python -m mypy app deployment

      - name: Apply test database migrations
        run: python -m app.migrate

      - name: Run consultation tests
        run: >
          python -m pytest -q
          tests/test_consultation_agent.py
          tests/test_consultation_gateway.py
          tests/test_customer_memory.py
          tests/test_customer_login_gate.py
          tests/test_customer_catalog.py
          tests/test_foundation.py
          tests/test_marketing.py


  publish:
    name: Build and publish images
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_PREFIX: ghcr.io/yohhanz/medical-aesthetics

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build frontend applications
        env:
          VITE_CUSTOMER_URL: /
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build --workspace @ma/customer
          npm --prefix frontend run build --workspace @ma/admin -- --mode cloud-demo

      - name: Build Docker images
        run: |
          set -euo pipefail

          SOURCE="https://github.com/$GITHUB_REPOSITORY"

          docker build \
            -f backend/sandbox/Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t medical-consultation-sandbox:local \
            -t "${IMAGE_PREFIX}-sandbox:${GITHUB_SHA}" \
            backend

          docker build \
            -f backend/deployment/Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "${IMAGE_PREFIX}-api:${GITHUB_SHA}" \
            backend

          docker build \
            -f deploy/cloud-demo/web.Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "${IMAGE_PREFIX}-web:${GITHUB_SHA}" \
            .

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push Docker images
        run: |
          set -euo pipefail

          docker push "${IMAGE_PREFIX}-sandbox:${GITHUB_SHA}"
          docker push "${IMAGE_PREFIX}-api:${GITHUB_SHA}"
          docker push "${IMAGE_PREFIX}-web:${GITHUB_SHA}"

          echo "Published commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
