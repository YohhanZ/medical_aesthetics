name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend run test

      - name: Build customer application
        env:
          VITE_CUSTOMER_URL: /
        run: npm --prefix frontend run build --workspace @ma/customer

      - name: Build admin application
        env:
          VITE_CUSTOMER_URL: /
        run: npm --prefix frontend run build --workspace @ma/admin -- --mode cloud-demo

  backend:
    name: Backend checks and consultation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      MA_ENVIRONMENT: test
      MA_AGENT_RUNTIME: inprocess
      LANGSMITH_TRACING: "false"
      MA_DATABASE_URL: "postgresql://ma_ci:ci-test-only@127.0.0.1:55434/ma_m1_test"
      MA_TEST_DATABASE_URL: "postgresql://ma_ci:ci-test-only@127.0.0.1:55434/ma_m1_test"

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: ma_m1_test
          POSTGRES_USER: ma_ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U ma_ci -d ma_m1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock -r deployment/requirements.lock
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run type checking
        run: python -m mypy app deployment

      - name: Apply test database migrations
        run: python -m app.migrate

      - name: Run consultation tests
        run: >
          python -m pytest -q
          tests/test_consultation_agent.py
          tests/test_consultation_gateway.py