limit_req_zone $binary_remote_addr zone=medical_api:1m rate=10r/s;
server {
  listen 80;
  server_name 43.142.39.108;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 308 https://43.142.39.108:8080$request_uri; }
}
server {
  listen 443 ssl;
  server_name 43.142.39.108;
  ssl_certificate /etc/letsencrypt/live/43.142.39.108/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/43.142.39.108/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location /api/ {
    limit_req zone=medical_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control no-store always;
  }
  location = /admin { return 308 /admin/; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
