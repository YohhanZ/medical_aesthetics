name: medical-agent-m1
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: ma_m1
      POSTGRES_USER: ma_m1
      POSTGRES_PASSWORD: ${M1_DB_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - agent_m1_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ma_m1 -d ma_m1"]
      interval: 5s
      timeout: 3s
      retries: 12
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${M2_GRAPH_PASSWORD:?Set a local graph password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:57475:7474"
      - "127.0.0.1:57689:7687"
    volumes:
      - agent_m2_graph:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >-
      etcd --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
      --auto-compaction-mode=revision --auto-compaction-retention=1000
      --quota-backend-bytes=4294967296 --snapshot-count=50000 --log-level=warn
    volumes:
      - agent_m2_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${M2_MINIO_ACCESS_KEY:?Configure isolated Milvus object storage}
      MINIO_ROOT_PASSWORD: ${M2_MINIO_SECRET_KEY:?Configure isolated Milvus object storage}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - agent_m2_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "127.0.0.1:59531:19530"
      - "127.0.0.1:59091:9091"
    volumes:
      - agent_m2_milvus:/var/lib/milvus
      - ./runtime/milvus.yaml:/milvus/configs/user.yaml:ro
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  agent_m1_pg:
  agent_m2_graph:
  agent_m2_etcd:
  agent_m2_minio:
  agent_m2_milvus:
